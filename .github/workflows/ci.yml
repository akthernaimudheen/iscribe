name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install ffmpeg (audio probe + whisper decode)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl

      - name: Run test suite
        env:
          # Deterministic, secret-free CI environment. Real consultation
          # fixtures are NOT in the repository; the corresponding tests skip.
          ISCRIBE_ENV: development
          ISCRIBE_PRELOAD_MODELS: "false"
          HF_HUB_OFFLINE: "0"
        run: python -m pytest -q

  phi-guard:
    name: PHI / secret guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse real consultation content patterns
        run: |
          set -e
          # Escalate when patterns derived from the REAL consultation fixtures
          # appear in tracked files. (Synthetic test content uses the Ofcom
          # fictional range; these markers belong to actual patients.) The
          # workflow file itself is excluded — it necessarily contains the
          # patterns it scans for.
          SCOPE="-- . ':(exclude).github/workflows/ci.yml'"
          MATCHES=0
          for pat in "07742193218" "06/22/1972" "Helen White" "Prescott Road"; do
            if eval git grep -lI "$pat" "$SCOPE" ; then
              echo "::error::PHI marker pattern found in tracked files: $pat"
              MATCHES=1
            fi
          done
          # Malayalam transcript passages: the frozen real consultation phrase
          if eval git grep -lI "എടുക്കുന്നുണ്ട്" "$SCOPE" ; then
            echo "::error::real Malayalam transcript passage found in tracked files"
            MATCHES=1
          fi
          exit $MATCHES

      - name: Refuse committed secrets and runtime data
        run: |
          set -e
          FAIL=0
          # .env-family files (except the template) must never be tracked.
          if git ls-files | grep -E '^\.env(\..*)?$' | grep -v '^\.env\.example$'; then
            echo "::error::.env file tracked in git"; FAIL=1
          fi
          # Databases and runtime data must never be tracked.
          if git ls-files | grep -E '\.(db|sqlite3)$'; then
            echo "::error::database file tracked in git"; FAIL=1
          fi
          # Audio files are allowed ONLY where a committed generator script
          # certifies synthetic provenance (the edge-tts fixtures: the
          # indic-Malayalam test set and the English consultation fixture).
          # Real recordings live outside git; this allowlist keeps it honest.
          ALLOWED_AUDIO='^(scribe_engine/stt/experimental/indic_malayalam/|tests/fixtures/english_consultation\.wav$)'
          if git ls-files | grep -E '\.(wav|mp3|m4a|webm|ogg)$' \
              | grep -vE "$ALLOWED_AUDIO"; then
            echo "::error::audio file tracked outside the synthetic-fixture allowlist"; FAIL=1
          fi
          # Obvious live-secret shapes (long random strings assigned to vars).
          if git grep -nIE '(DEEPGRAM_API_KEY|ISCRIBE_ACCESS_TOKEN|ISCRIBE_TRAINING_ADMIN_TOKEN|ISCRIBE_BOOTSTRAP_ADMIN_CODE)\s*=\s*["'"'"'][A-Za-z0-9_-]{24,}["'"'"']' -- ':!*.md' ':!.env.example' ':!tests/*' ':!scripts/*'; then
            echo "::error::hardcoded secret-looking assignment"; FAIL=1
          fi
          exit $FAIL

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (models baked in; no push from CI)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: iscribe:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
